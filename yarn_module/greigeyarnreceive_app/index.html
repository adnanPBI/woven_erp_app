<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greige Yarn Receive Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-bg: linear-gradient(135deg, #121212 0%, #1e1e1e 100%);
            --container-bg: #252525;
            --text-color: #e0e0e0;
            --accent-color: #00c4ff;
            --card-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
            --btn-shadow: 0 5px 15px rgba(0, 0, 0, 0.4);
            --text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            --border-glow: rgba(0, 196, 255, 0.3);
        }

        body {
            background: var(--primary-bg);
            font-family: 'Poppins', sans-serif;
            color: var(--text-color);
            margin: 0;
            padding: 12px;
            box-sizing: border-box;
            height: 100vh;
            overflow: auto;
            background-attachment: fixed;
        }

        .main-container {
            background: var(--container-bg);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            padding: 15px;
            border: 2px solid #3a3a3a;
            height: auto;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 1;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(0, 196, 255, 0.03) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(0, 196, 255, 0.03) 0%, transparent 20%);
        }

        .main-container::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(45deg, transparent 49%, rgba(255, 255, 255, 0.03) 50%, transparent 51%);
            background-size: 10px 10px;
            pointer-events: none;
        }

        .header-controls {
            display: flex;
            flex-direction: column;
            gap: 24px;
            margin-bottom: 10px;
            flex-shrink: 0;
            background: rgba(0, 0, 0, 0.2);
            padding: 18px 15px;
            border-radius: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
            z-index: 1050;
            overflow: visible;
        }

        .header-title {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .header-buttons {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .button-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .header-controls::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 15%;
            width: 70%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-color), transparent);
        }

        .header-controls h1 {
            font-size: 1.9rem;
            font-weight: 700;
            color: var(--text-color);
            text-shadow: var(--text-shadow);
            margin: 10;
            background: linear-gradient(45deg, #FFA500, #FFD580);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            position: absolute;
            letter-spacing: 1px;
            white-space: nowrap;
        }

        .header-controls h1::after {
            content: '';
            position: absolute;
            bottom: -20px;
            left: 70%;
            transform: translateX(-50%);
            width: 140%;
            height: 2px;
            background: linear-gradient(90deg, var(--accent-color), transparent);
            border-radius: 3px;
            margin-bottom: 20px;
        }

        /* Gradient button styles */
        .header-controls .btn, .header-controls .btn.dropdown-toggle {
            border-radius: 8px;
            transition: all 0.3s cubic-bezier(0.165, 0.84, 0.44, 1);
            border: none;
            color: #fff;
            box-shadow: var(--btn-shadow);
            font-size: 0.85rem;
            padding: 8px 16px;
            position: relative;
            overflow: hidden;
            z-index: 1;
            font-weight: 600;
            white-space: nowrap;
            min-width: 140px;
            text-align: center;
        }

         /* Specific gradient colors for different button types */
        .btn-info {
            background: linear-gradient(135deg,  #0d8991, #3bbcc4, #4fb4db) !important;
        }

        .btn-warning {
            background: linear-gradient(135deg, #ffc107, #fd7e14) !important;
        }

        .btn-primary {
            background: linear-gradient(135deg, #0a3a57, #0c8731, #09ad92) !important;
        }

        .btn-success {
            background: linear-gradient(135deg, #1e3954, #3b80db) !important;
        }

        .btn-danger {
            background: linear-gradient(135deg, #991509, #e83e8c) !important;
        }
        
        .btn-tertiary {
            background: linear-gradient(125deg, #090669, #394f99) !important;
        }

        .btn-secondary {
            background: linear-gradient(135deg, #6c757d, #495057) !important;
        }

        .header-controls .btn::before, .header-controls .btn.dropdown-toggle::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: all 0.5s ease;
            z-index: -1;
        }

        .header-controls .btn:hover, .header-controls .btn.dropdown-toggle:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.6);
        }

        .header-controls .btn:hover::before, .header-controls .btn.dropdown-toggle:hover::before {
            left: 100%;
        }

        .header-controls .btn i {
            margin-right: 6px;
        }

        .dropdown-menu {
            background: #303030;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4);
            z-index: 1051;
        }

        .dropdown-item {
            color: var(--text-color);
            font-size: 0.85rem;
            padding: 8px 15px;
            transition: all 0.3s ease;
        }

        .dropdown-item:hover {
            background: #404040;
            color: #ffffff;
        }

        .form-container {
            background: #252525;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 15px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
            position: relative;
            z-index: 2;
        }

        .form-container:hover {
            background: #2D2D2D;
            box-shadow: inset 0 0 25px rgba(0, 0, 0, 0.3), 0 0 15px var(--border-glow);
            border-color: rgba(0, 196, 255, 0.2);
        }

        .form-label {
            color: var(--accent-color);
            font-weight: 600;
            margin-bottom: 0;
            font-size: 0.8rem;
            width: 40%;
            display: flex;
            align-items: center;
            flex-shrink: 0;
        }

        .form-control, .form-select {
            background-color: #404040;
            border: 1px solid #505050;
            color: var(--text-color);
            border-radius: 10px;
            padding: 6px 10px;
            height: 35px;
            font-size: 0.85rem;
            transition: all 0.3s ease;
            width: 60%;
        }

        /* Blue color for date picker icon */
        .form-group i.fa-calendar-alt,
        .form-group i.fa-calendar-check {
            color: var(--accent-color) !important;
        }

        /* Remove spinner from number inputs */
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        input[type="number"] {
            -moz-appearance: textfield;
        }

        .form-control:focus, .form-select:focus {
            background-color: #454545;
            color: var(--text-color);
            border-color: var(--accent-color);
            box-shadow: 0 0 0 0.25rem rgba(0, 196, 255, 0.25);
        }

        .form-control:hover, .form-select:hover {
            border-color: var(--accent-color);
        }

        /* Horizontal layout for form groups */
        .form-group {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            gap: 10px;
            position: relative;
        }

        .form-group i {
            position: absolute;
            right: 10px;
            color: var(--accent-color);
            font-size: 0.9rem;
            transition: all 0.3s ease;
            pointer-events: none;
            z-index: 10;
        }

        .form-group .form-control, .form-group .form-select {
            padding-right: 30px;
        }

        .form-group .form-control:focus ~ i,
        .form-group .form-select:focus ~ i {
            color: #ffffff;
            transform: scale(1.1);
        }

        .result-field {
            background-color: #d68733 !important;
            border: none;
            color: #000 !important;
            font-weight: 600;
            padding: 6px 10px;
            border-radius: 10px;
            font-size: 0.95rem;
        }

        /* Collapsible section styles */
        .breakdown-card {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border: 2px solid #3a3a3a;
            border-radius: 15px;
            padding: 8px;
            margin-bottom: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .collapsible-toggle {
            cursor: pointer;
            user-select: none;
            transition: all 0.2s ease;
            width: 100%;
            padding: 14px 0;
        }

        .collapsible-toggle:hover {
            background: rgba(0, 196, 255, 0.1);
            border-radius: 4px;
        }

        .breakdown-title {
            color: var(--accent-color);
            font-size: 1.4rem;
            font-weight: 600;
            text-align: center;
            margin-bottom: 15px;
            text-shadow: var(--text-shadow);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .breakdown-title i {
            position: absolute;
            right: 0;
        }

        .collapsible-section {
            display: none;
        }

        /* Vertical Layout - THREE columns */
        .vertical-layout {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
        }

        .column {
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        /* Special handling for textarea */
        .form-group textarea.form-control {
            width: 80%;
            height: auto;
            min-height: 35px;
            resize: vertical;
        }

        /* Multi-line dropdown for Received Against Dispo NO(s) */
        .multi-line-dropdown {
            max-height: 200px;
            overflow-y: auto;
            background-color: #404040;
            border: 1px solid #505050;
            border-radius: 10px;
            padding: 6px 10px;
            width: 60%;
            position: relative;
        }

        .multi-line-dropdown .dropdown-item {
            padding: 4px 8px;
            font-size: 0.8rem;
            border-bottom: 1px solid #555;
        }

        .multi-line-dropdown .dropdown-item:last-child {
            border-bottom: none;
        }

        /* Table styles with adjusted column widths */
        .table-responsive {
            overflow-x: auto;
            margin-bottom: 15px;
        }

        .table-dark {
            --bs-table-bg: #2D2D2D;
            --bs-table-border-color: #505050;
        }

        .table th, .table td {
            vertical-align: middle;
            white-space: nowrap;
            padding: 4px;
            font-size: 0.85rem;
        }

        .table th {
            background-color: #252525;
            color: var(--accent-color);
            text-align: center;
            font-weight: 600;
        }

        /* Updated column widths for better proportions */
        .date-column {
            width: 7%;
        }

        .quantity-column {
            width: 7%;
        }

        .dispo-column {
            width: 60%; /* Increased for triple width */
        }

        .warp-column, .weft-column {
            width: 12%;
        }

        .total-column {
            width: 14%;
        }

        .table-input-sm .form-control {
            padding: 0px 4px;
            font-size: 0.9rem;
            height: 30px;
            text-align: center;
            background-color: #404040;
            border: 1px solid #505050;
            color: var(--text-color);
        }

        /* Specific width adjustments for different columns */
        .date-column .form-control {
            width: 85%;
        }

        .quantity-column .form-control {
            width: 85%;
        }

        .warp-column .form-control,
        .weft-column .form-control {
            width: 90%;
        }

        .dispo-column .form-select {
            width: 100%;
            padding: 0px 4px;
            font-size: 0.85rem;
            height: 30px;
            background-color: #404040;
            border: 1px solid #505050;
            color: var(--text-color);
        }

        .total-column .form-control {
            width: 95%;
        }

        .table-input-sm .result-field {
            background-color: #d68733;
            color: #000;
            font-weight: 600;
        }

        .btn-sm {
            padding: 4px 8px;
            font-size: 0.78rem;
        }

        @media (max-width: 1200px) {
            .button-row {
                justify-content: center;
                gap: 6px;
            }
            
            .header-controls .btn, .header-controls .btn.dropdown-toggle {
                font-size: 0.8rem;
                padding: 6px 12px;
                min-width: 120px;
            }

            /* Three columns for medium screens */
            .vertical-layout {
                grid-template-columns: 1fr 1fr 1fr;
            }
        }

        @media (max-width: 992px) {
            .button-row {
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
            }
            
            .header-controls .btn, .header-controls .btn.dropdown-toggle {
                width: 100%;
                max-width: 200px;
                margin: 0 auto;
            }

            /* Two columns for tablets */
            .vertical-layout {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 768px) {
            .header-controls .btn, .header-controls .btn.dropdown-toggle {
                font-size: 0.75rem;
                padding: 6px 10px;
                min-width: 100px;
            }

            .form-label {
                font-size: 0.75rem;
            }

            .form-control, .form-select {
                font-size: 0.8rem;
                padding: 5px 8px;
                height: 32px;
            }

            /* Single column for mobile */
            .vertical-layout {
                grid-template-columns: 1fr;
            }

            .form-group {
                flex-direction: column;
                align-items: stretch;
                gap: 5px;
            }

            .form-label {
                width: 100%;
            }

            .form-control, .form-select, .form-group textarea.form-control {
                width: 100%;
            }

            .form-group i {
                position: absolute;
                right: 10px;
                top: 50%;
                transform: translateY(-50%);
            }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="header-controls">
            <div class="header-title">
                <h1>Greige Yarn Receive Form</h1>
            </div>
            <div class="header-buttons">
                <!-- First Row - Added Search Yarn Lot dropdown -->
                <div class="button-row">
                    <div class="dropdown">
                        <button class="btn btn-info dropdown-toggle" type="button" id="searchYarnDetailDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="fas fa-search"></i> Search Yarn Detail
                        </button>
                        <ul class="dropdown-menu" aria-labelledby="searchYarnDetailDropdown">
                        </ul>
                    </div>
                    <div class="dropdown">
                        <button class="btn btn-info dropdown-toggle" type="button" id="searchPostedLCDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="fas fa-search"></i> Search Posted LC
                        </button>
                        <ul class="dropdown-menu" aria-labelledby="searchPostedLCDropdown">
                        </ul>
                    </div>
                    <div class="dropdown">
                        <button class="btn btn-info dropdown-toggle" type="button" id="searchYarnLotDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="fas fa-search"></i> Search Yarn Lot Number
                        </button>
                        <ul class="dropdown-menu" aria-labelledby="searchYarnLotDropdown">
                        </ul>
                    </div>
                    <button class="btn btn-warning" id="clearFormBtn"><i class="fas fa-eraser"></i> Clear Form</button>
                </div>
                
                <!-- Second Row -->
                <div class="button-row">
                    <button class="btn btn-primary btn-submit" id="saveToMySQLBtn"><i class="fas fa-save"></i> Save to MySQL</button>
                    <button class="btn btn-primary btn-submit" id="updateToMySQLBtn"><i class="fas fa-refresh"></i> Update MySQL Data</button>
                    <button class="btn btn-success" id="saveToExcelBtn"><i class="fas fa-file-excel"></i> Export to Excel</button>
                    <button class="btn btn-tertiary" id="savedYarnBtn"><i class="fas fa-list"></i> Saved Yarn Records</button>
                    <button class="btn btn-danger" id="deleteYarnBtn"><i class="fas fa-trash-alt"></i> Delete Record</button>
                    <a href="#" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Back</a>
                </div>
            </div>
        </div>

        <form id="yarnReceivedForm">
            <!-- Yarn Receive Breakdown - Collapsible Section -->
            <div class="breakdown-card">
                <div class="collapsible-toggle" id="breakdownToggle">
                    <div class="breakdown-title">
                        Yarn Receive Breakdown
                        <i class="fas fa-chevron-down"></i>
                    </div>
                </div>
                <div class="collapsible-section" id="yarnBreakdownContent">
                    <!-- Search Dispo Section -->
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="searchDispo" class="form-label">Search Dispo</label>
                                <select class="form-select" id="searchDispo" name="search_dispo">
                                    </option>
                                </select>
                                <i class="fas fa-search"></i>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="totalReceivedAgainstGD" class="form-label">Total Yarn Received Against Dispo (Kgs)</label>
                                <input type="number" step="0.01" class="form-control result-field" id="totalReceivedAgainstGD" name="total_received_against_gd" value="" readonly>
                                <i class="fas fa-sum"></i>
                            </div>
                        </div>
                    </div>

                    <!-- Two Tables Side by Side -->
                    <div class="row">
                        <!-- Left Table - Max 10 rows -->
                        <div class="col-md-6">
                            <h6 class="text-info mb-2">Yarn Received Details</h6>
                            <div class="table-responsive">
                                <table class="table table-dark table-bordered table-input-sm" id="yarnReceivedTable">
                                    <thead>
                                        <tr>
                                            <th class="date-column">Yarn Receive Date</th>
                                            <th class="quantity-column">Yarn Receive Quantity (Kgs)</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr>
                                            <td class="date-column"><input type="date" class="form-control" name="yarn_received_date[]" value=""></td>
                                            <td class="quantity-column"><input type="number" step="0.01" class="form-control" name="yarn_received_quantity[]" value=""></td>
                                        </tr>
                                    </tbody>
                                    <tfoot>
                                        <tr>
                                            <td class="date-column"><strong>Total</strong></td>
                                            <td class="quantity-column"><span id="totalYarnReceived" class="result-field">0</span></td>
                                        </tr>
                                    </tfoot>
                                </table>
                                <div class="d-flex gap-2">
                                    <button type="button" class="btn btn-success btn-sm" id="addYarnReceivedRowBtn">
                                        <i class="fas fa-plus"></i> Add Row
                                    </button>
                                    <button type="button" class="btn btn-danger btn-sm" id="deleteYarnReceivedRowBtn">
                                        <i class="fas fa-trash"></i> Delete Row
                                    </button>
                                </div>
                            </div>
                        </div>

                        <!-- Right Table - Max 30 rows -->
                        <div class="col-md-6">
                            <h6 class="text-info mb-2">Requirements Details</h6>
                            <div class="table-responsive">
                                <table class="table table-dark table-bordered table-input-sm" id="requirementsTable">
                                    <thead>
                                        <tr>
                                            <th class="warp-column">Warp Required (Kgs)</th>
                                            <th class="weft-column">Weft Required (Kgs)</th>
                                            <th class="dispo-column">Dispo No</th>
                                            <th class="total-column">Total Required (Kgs)</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr>
                                            <td class="warp-column"><input type="number" step="0.01" class="form-control" name="warp_required[]" value=""></td>
                                            <td class="weft-column"><input type="number" step="0.01" class="form-control" name="weft_required[]" value=""></td>
                                            <td class="dispo-column">
                                                <select class="form-select" name="dispo_no[]">
                                                    <option value="">Select Dispo</option>
                                             
                                                </select>
                                            </td>
                                            <td class="total-column"><input type="number" step="0.01" class="form-control result-field" name="total_required[]" value="" readonly></td>
                                        </tr>
                                    </tbody>
                                    <tfoot>
                                        <tr>
                                            <td class="warp-column"><span id="totalWarpRequired" class="result-field">0</span></td>
                                            <td class="weft-column"><span id="totalWeftRequired" class="result-field">0</span></td>
                                            <td class="dispo-column"><strong>Total</strong></td>
                                            <td class="total-column"><span id="totalAllRequired" class="result-field">0</span></td>
                                        </tr>
                                    </tfoot>
                                </table>
                                <div class="d-flex gap-2">
                                    <button type="button" class="btn btn-success btn-sm" id="addRequirementsRowBtn">
                                        <i class="fas fa-plus"></i> Add Row
                                    </button>
                                    <button type="button" class="btn btn-danger btn-sm" id="deleteRequirementsRowBtn">
                                        <i class="fas fa-trash"></i> Delete Row
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Form Fields in Horizontal Layout - THREE COLUMNS -->
            <div class="form-container">
                <div class="vertical-layout">
                    <!-- First Column -->
                    <div class="column">
                        <div class="form-group">
                            <label for="yarnCount" class="form-label">Yarn Count</label>
                            <input type="text" class="form-control" id="yarnCount" name="yarn_count" value="">
                            <i class="fas fa-sort-numeric-up"></i>
                        </div>
                         <div class="form-group">
                            <label for="numberOfPly" class="form-label">Number of Ply</label>
                            <input type="text" class="form-control" id="numberOfPly" name="yarn_ply" value="">
                            <i class="fas fa-random"></i>
                        </div>
                        
                        <div class="form-group">
                            <label for="lcDate" class="form-label">L/C Date</label>
                            <input type="date" class="form-control" id="lcDate" name="lc_date" value="">
                            <i class="fas fa-calendar-alt"></i>
                        </div>

                        <div class="form-group">
                            <label for="beneficiaryFactory" class="form-label">Beneficiary Factory</label>
                            <input type="text" class="form-control" id="beneficiaryFactory" name="beneficiary_factory" value="">

function calculateRequirementsTotal() {
    let totalWarp = 0;
    let totalWeft = 0;
    let totalAll = 0;

    const warpInputs = document.querySelectorAll('input[name="warp_required[]"]');
    const weftInputs = document.querySelectorAll('input[name="weft_required[]"]');
    const totalInputs = document.querySelectorAll('input[name="total_required[]"]');

    warpInputs.forEach((input, index) => {
        const warpValue = parseFloat(input.value) || 0;
        const weftValue = parseFloat(weftInputs[index]?.value) || 0;
        const total = warpValue + weftValue;
        
        totalInputs[index].value = total.toFixed(2);
        
        totalWarp += warpValue;
        totalWeft += weftValue;
        totalAll += total;
    });

    const totalWarpEl = document.getElementById('totalWarpRequired');
    const totalWeftEl = document.getElementById('totalWeftRequired');
    const totalAllEl = document.getElementById('totalAllRequired');
    
    if (totalWarpEl) totalWarpEl.textContent = totalWarp.toFixed(0);
    if (totalWeftEl) totalWeftEl.textContent = totalWeft.toFixed(0);
    if (totalAllEl) totalAllEl.textContent = totalAll.toFixed(0);
}

function calculateYarnReceivedTotal() {
    let total = 0;
    const quantityInputs = document.querySelectorAll('input[name="yarn_received_quantity[]"]');
    
    quantityInputs.forEach(input => {
        total += parseFloat(input.value) || 0;
    });
    
    const totalEl = document.getElementById('totalYarnReceived');
    if (totalEl) totalEl.textContent = total.toFixed(0);
}

function calculateTotalTaka() {
    const receivedQty = parseFloat(document.getElementById('receiptQtyKgs')?.value) || 0;
    const rate = parseFloat(document.getElementById('piLcRate')?.value) || 0;
    const dollarRate = parseFloat(document.getElementById('dollarLcRate')?.value) || 120;
    
    const totalTaka = receivedQty * rate * dollarRate;
    
    const totalTakaEl = document.getElementById('totalTakaBD');
    if (totalTakaEl) totalTakaEl.value = totalTaka.toFixed(2);
}

function formatDateForInput(dateString) {
    if (!dateString) return '';
    
    try {
        const date = new Date(dateString);
        if (isNaN(date.getTime())) return '';
        
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const day = String(date.getDate()).padStart(2, '0');
        
        return `${year}-${month}-${day}`;
    } catch (e) {
        console.error('Date formatting error:', e);
        return '';
    }
}

function initializeFormFromTop() {

    document.documentElement.scrollTop = 0;

function setupKeyboardNavigation() {
    const formFields = [
        'yarnCount', 'yarnBrand', 'numberOfPly', 'yarnLot', 'lcDate', 'lcNo',
        'beneficiaryFactory', 'piLcRate', 'receivedAgainstPONo', 'dollarLcRate',
        'receivedAgainstDispoNos', 'rateCostSheet', 'piNo', 'countryOfOrigin',
        'receivedStartDate', 'importLocalSource', 'yarnType', 'receiptQtyKgs',
        'yarnComposition', 'totalTakaBD', 'lastReceivedDate', 'lcUnit',
        'dispoNosForYarnLot', 'challanNo', 'specialNotes'
    ];

    formFields.forEach((fieldId, index) => {
        const field = document.getElementById(fieldId);
        if (field) {
            field.addEventListener('keydown', function(e) {
                if (e.key === 'ArrowDown' || (e.key === 'Tab' && !e.shiftKey)) {
                    e.preventDefault();
                    const nextIndex = (index + 1) % formFields.length;
                    const nextField = document.getElementById(formFields[nextIndex]);
                    if (nextField) {
                        nextField.focus();
                        if (nextField.type === 'text' || nextField.type === 'number') {
                            nextField.select();
                        }
                    }
                } else if (e.key === 'ArrowUp' || (e.key === 'Tab' && e.shiftKey)) {
                    e.preventDefault();
                    const prevIndex = index === 0 ? formFields.length - 1 : index - 1;
                    const prevField = document.getElementById(formFields[prevIndex]);
                    if (prevField) {
                        prevField.focus();
                        if (prevField.type === 'text' || prevField.type === 'number') {
                            prevField.select();
                        }
                    }
                }
            });
        }
    });
}

async function fetchDispoNumbers() {
    try {
        const response = await fetch('/main/api/dispo/numbers', { 
            method: 'GET', 
            credentials: 'include' 
        });
        if (!response.ok) throw new Error(`HTTP error! Status: ${response.status}`);
        
        const dispoNumbers = await response.json();
        populateDispoDropdowns(dispoNumbers);
        populateSearchDispoDropdown(dispoNumbers);
        
    } catch (error) {
        console.error('Failed to load dispo numbers:', error);
    }
}

function populateDispoDropdowns(dispoNumbers) {
    const receivedAgainstDispoSelect = document.getElementById('receivedAgainstDispoNos');
    if (receivedAgainstDispoSelect) {
        const currentValue = receivedAgainstDispoSelect.value;
        receivedAgainstDispoSelect.innerHTML = '<option value="">Select Dispo</option>';
        
        dispoNumbers.forEach(dispoNo => {
            const option = document.createElement('option');
            option.value = dispoNo;
            option.textContent = dispoNo;
            if (dispoNo === currentValue) {
                option.selected = true;
            }
            receivedAgainstDispoSelect.appendChild(option);
        });
        
        // Restore the value if it existed
        if (currentValue) {
            receivedAgainstDispoSelect.value = currentValue;
        }
    }
    
    const dispoSelects = document.querySelectorAll('select[name="dispo_no[]"]');
    dispoSelects.forEach(select => {
        const currentValue = select.value;
        select.innerHTML = '<option value="">Select Dispo</option>';
        
        dispoNumbers.forEach(dispoNo => {
            const option = document.createElement('option');
            option.value = dispoNo;
            option.textContent = dispoNo;
            if (dispoNo === currentValue) {
                option.selected = true;
            }
            select.appendChild(option);
        });
    });
}

function populateSearchDispoDropdown(dispoNumbers) {
    const searchDispoSelect = document.getElementById('searchDispo');
    if (searchDispoSelect) {
        searchDispoSelect.innerHTML = '<option value="">Select Dispo</option>';
        
        dispoNumbers.forEach(dispoNo => {
            const option = document.createElement('option');
            option.value = dispoNo;
            option.textContent = dispoNo;
            searchDispoSelect.appendChild(option);
        });
        
        searchDispoSelect.addEventListener('change', function() {
            if (this.value) {
                updateTotalReceivedAgainstDispo(this.value);
            } else {
                const totalField = document.getElementById('totalReceivedAgainstGD');
                if (totalField) totalField.value = '0.00';
            }
        });
    }
}

async function updateTotalReceivedAgainstDispo(selectedDispo) {
    try {
        const response = await fetch(`/main/api/yarn/total-received-by-dispo/${encodeURIComponent(selectedDispo)}`, {
            method: 'GET',
            credentials: 'include'
        });
        
        if (response.ok) {
            const data = await response.json();
            const totalField = document.getElementById('totalReceivedAgainstGD');
            if (totalField) {
                totalField.value = parseFloat(data.total_received || 0).toFixed(2);
            }
        } else {
            console.error('Failed to fetch total received for dispo:', selectedDispo);
            const totalField = document.getElementById('totalReceivedAgainstGD');
            if (totalField) totalField.value = '0.00';
        }
    } catch (error) {
        console.error('Error fetching total received for dispo:', error);
        const totalField = document.getElementById('totalReceivedAgainstGD');
        if (totalField) totalField.value = '0.00';
    }
}

function attachYarnDropdownListeners() {
    document.querySelectorAll('ul[aria-labelledby="searchYarnDetailDropdown"] .dropdown-item').forEach(item => {
        const newItem = item.cloneNode(true);
        item.parentNode.replaceChild(newItem, item);
        
        newItem.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            
            const yarnData = this.getAttribute('data-yarn-data');
            if (yarnData && !this.classList.contains('disabled')) {
                const searchButton = document.getElementById('searchYarnDetailDropdown');
                if (searchButton) {
                    const parsedData = JSON.parse(yarnData);
                    searchButton.innerHTML = `<i class="fas fa-search"></i> Yarn: ${parsedData.yarn_brand}`;
                    
                    const dropdown = bootstrap.Dropdown.getInstance(searchButton);
                    if (dropdown) dropdown.hide();
                }
                fetchYarnDataByDetail(JSON.parse(yarnData));
            }
        });
    });
}

function collectYarnReceivedDetails() {
    const dates = document.querySelectorAll('input[name="yarn_received_date[]"]');
    const quantities = document.querySelectorAll('input[name="yarn_received_quantity[]"]');
    const details = [];
    
    dates.forEach((dateInput, index) => {
        if (dateInput.value || quantities[index]?.value) {
            details.push({
                received_date: dateInput.value,
                quantity_kgs: parseFloat(quantities[index]?.value) || 0
            });
        }
    });
    
    return details;
}

function collectYarnRequirementsDetails() {
    const warpInputs = document.querySelectorAll('input[name="warp_required[]"]');
    const weftInputs = document.querySelectorAll('input[name="weft_required[]"]');
    const dispoSelects = document.querySelectorAll('select[name="dispo_no[]"]');
    const totalInputs = document.querySelectorAll('input[name="total_required[]"]');
    const details = [];
    
    warpInputs.forEach((warpInput, index) => {
        const warpValue = parseFloat(warpInput.value) || 0;
        const weftValue = parseFloat(weftInputs[index]?.value) || 0;
        const dispoValue = dispoSelects[index]?.value || '';
        const totalValue = parseFloat(totalInputs[index]?.value) || 0;
        
        if (warpValue || weftValue || dispoValue) {
            details.push({
                warp_required_kgs: warpValue,
                weft_required_kgs: weftValue,
                dispo_no: dispoValue,
                total_required_kgs: totalValue
            });
        }
    });
    
    return details;
}

function populateYarnForm(data) {
    const form = document.getElementById('yarnReceivedForm');
    if (!form || !data) {
        console.error('Form or data is missing');
        return;
    }

    console.log('Starting form population with data:', data);

    if (data.id) {
        currentRecordId = data.id;
    }

    const fieldMappings = {
        'yarn_count': 'yarnCount',
        'yarn_ply': 'numberOfPly',
        'lc_no': 'lcNo',
        'lc_date': 'lcDate',
        'beneficiary_factory': 'beneficiaryFactory',
        'pi_no': 'piNo',
        'received_start_date': 'receivedStartDate',
        'yarn_type': 'yarnType',
        'yarn_composition': 'yarnComposition',
        'last_received_date': 'lastReceivedDate',
        'yarn_brand': 'yarnBrand',
        'yarn_lot': 'yarnLot',
        'pi_lc_rate': 'piLcRate',
        'dollar_rate': 'dollarLcRate',
        'rate_cost_sheet': 'rateCostSheet',
        'country_of_origin': 'countryOfOrigin',
        'import_local_source': 'importLocalSource',
        'receipt_qty_kgs': 'receiptQtyKgs',
        'total_taka_bd': 'totalTakaBD',
        'lc_unit': 'lcUnit',
        'challan_no': 'challanNo',
        'special_notes': 'specialNotes',
        'search_dispo': 'searchDispo',
        'total_received_against_gd': 'totalReceivedAgainstGD'
    };

    // Populate standard fields
    Object.keys(fieldMappings).forEach(dataKey => {
        const fieldId = fieldMappings[dataKey];
        const input = document.getElementById(fieldId);
        
        if (input && data[dataKey] !== undefined && data[dataKey] !== null) {
            let valueToSet = data[dataKey];
            
            // Convert to string and trim
            if (typeof valueToSet === 'number') {
                valueToSet = valueToSet.toString();
            } else if (typeof valueToSet === 'string') {
                valueToSet = valueToSet.trim();
            }
            
            console.log(`Setting ${fieldId} (${dataKey}) = "${valueToSet}" (type: ${typeof valueToSet})`);
            
            if (input.type === 'date' && valueToSet) {
                input.value = formatDateForInput(valueToSet);
            } else {
                input.value = valueToSet;
            }
        }
    });

    // Handle PO field (could be select or input)
    const poField = document.getElementById('receivedAgainstPONo');
    if (poField && data.received_against_po_no) {
        console.log('Setting PO field:', data.received_against_po_no);
        poField.value = data.received_against_po_no;
    }

    // CRITICAL FIX: Handle Dispo field - ensure option exists before setting value
    const dispoField = document.getElementById('receivedAgainstDispoNos');
    if (dispoField && data.received_against_dispo_nos) {
        const dispoValue = data.received_against_dispo_nos.toString().trim();
        console.log('Attempting to set Dispo field to:', dispoValue);
        
        if (dispoField.tagName.toLowerCase() === 'select') {
            // Check if option exists
            let optionExists = false;
            for (let i = 0; i < dispoField.options.length; i++) {
                if (dispoField.options[i].value === dispoValue) {
                    optionExists = true;
                    console.log('Found existing option for:', dispoValue);
                    break;
                }
            }
            
            // If option doesn't exist, add it
            if (!optionExists && dispoValue) {
                console.log('Adding new option for:', dispoValue);
                const newOption = document.createElement('option');
                newOption.value = dispoValue;
                newOption.textContent = dispoValue;
                dispoField.appendChild(newOption);
            }
            
            // Now set the value
            dispoField.value = dispoValue;
            console.log('Dispo field value after setting:', dispoField.value);
        } else {
            // It's an input field
            dispoField.value = dispoValue;
        }
    }

    // Handle related_dispo_numbers for yarn lot
    if (data.related_dispo_numbers && data.related_dispo_numbers.length > 0) {
        const dispoNosField = document.getElementById('dispoNosForYarnLot');
        if (dispoNosField) {
            const dispoList = data.related_dispo_numbers.join(', ');
            dispoNosField.value = dispoList;
            console.log('Set dispoNosForYarnLot to:', dispoList);
        }
    }

    // Populate breakdown tables
    if (data.yarn_received_details && data.yarn_received_details.length > 0) {
        console.log('Populating yarn received table with', data.yarn_received_details.length, 'entries');
        populateYarnReceivedTable(data.yarn_received_details);
    }

    if (data.yarn_requirements_details && data.yarn_requirements_details.length > 0) {
        console.log('Populating requirements table with', data.yarn_requirements_details.length, 'entries');
        populateYarnRequirementsTable(data.yarn_requirements_details);
    }

    // Recalculate totals
    setTimeout(() => {
        calculateRequirementsTotal();
        calculateYarnReceivedTotal();
        calculateTotalTaka();
        console.log('Form population complete');
    }, 100);
}

async function deleteRecord(recordId) {
    if (!confirm(`Are you sure you want to delete record ID: ${recordId}? This action cannot be undone.`)) {
        return;
    }

    try {
        const response = await fetch(`/main/api/yarn/delete/${recordId}`, {
            method: 'DELETE',
            credentials: 'include'
        });

        if (!response.ok) {
            throw new Error(`HTTP error! Status: ${response.status}`);
        }

        alert('Record deleted successfully!');
        document.getElementById('savedYarnBtn').click();
    } catch (error) {
        console.error('Error deleting record:', error);
        alert('Failed to delete record: ' + error.message);
    }
}

async function exportRecordsFromModal() {
    document.getElementById('saveToExcelBtn').click();
}

function toggleCollapsible() {
    const collapsibleSection = document.getElementById('yarnBreakdownContent');
    const chevronIcon = document.querySelector('.breakdown-title i');
    
    if (!collapsibleSection) return;
    
    const isCurrentlyHidden = collapsibleSection.style.display === 'none' || collapsibleSection.style.display === '';
    collapsibleSection.style.display = isCurrentlyHidden ? 'block' : 'none';
    
    if (chevronIcon) {
        chevronIcon.classList.toggle('fa-chevron-down', !isCurrentlyHidden);
        chevronIcon.classList.toggle('fa-chevron-up', isCurrentlyHidden);
    }
}

// EVENT LISTENERS AND INITIALIZATION - Keep only in DOMContentLoaded
document.addEventListener('DOMContentLoaded', function() {
    // Initialize form from top
    initializeFormFromTop();
    
    // Setup keyboard navigation
    setupKeyboardNavigation();

    // Collapsible functionality
    const collapsibleToggle = document.getElementById('breakdownToggle');
    if (collapsibleToggle) {
        collapsibleToggle.addEventListener('click', function(e) {
            if (e.target.tagName === 'INPUT' || 
                e.target.tagName === 'SELECT' || 
                e.target.tagName === 'BUTTON' || 
                e.target.tagName === 'TEXTAREA') {
                return;
            }
            toggleCollapsible();
        });
    }

    // Save to MySQL button
    document.getElementById('saveToMySQLBtn').addEventListener('click', async function() {
        try {
            const formData = collectFormData();
            const yarnReceivedDetails = collectYarnReceivedDetails();
            const yarnRequirementsDetails = collectYarnRequirementsDetails();

            if (!formData.yarn_count || !formData.yarn_brand) {
                alert('Please fill in required fields: Yarn Count and Yarn Brand');
                return;
            }

            const response = await fetch('/main/api/yarn/save', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify({
                    formData: formData,
                    yarnReceivedDetails: yarnReceivedDetails,
                    yarnRequirementsDetails: yarnRequirementsDetails
                })
            });

            if (!response.ok) throw new Error(`HTTP error! Status: ${response.status}`);

            const result = await response.json();
            currentRecordId = result.id;
            alert('Data saved successfully to MySQL!');
            console.log('Save successful:', result);
            
            initializeFormFromTop();
        } catch (error) {
            console.error('Error saving data:', error);
            alert('Failed to save data: ' + error.message);
        }
    });

    // Update MySQL button
    document.getElementById('updateToMySQLBtn').addEventListener('click', async function() {
        if (!currentRecordId) {
            alert('No record selected for update. Please search and load a record first.');
            return;
        }

        try {
            const formData = collectFormData();
            const yarnReceivedDetails = collectYarnReceivedDetails();
            const yarnRequirementsDetails = collectYarnRequirementsDetails();

            if (!formData.yarn_count || !formData.yarn_brand) {
                alert('Please fill in required fields: Yarn Count and Yarn Brand');
                return;
            }

            const response = await fetch(`/main/api/yarn/update/${currentRecordId}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify({
                    formData: formData,
                    yarnReceivedDetails: yarnReceivedDetails,
                    yarnRequirementsDetails: yarnRequirementsDetails
                })
            });

            if (!response.ok) throw new Error(`HTTP error! Status: ${response.status}`);

            const result = await response.json();
            alert('Data updated successfully in MySQL!');
            console.log('Update successful:', result);
            
            initializeFormFromTop();
        } catch (error) {
            console.error('Error updating data:', error);
            alert('Failed to update data: ' + error.message);
        }

    // Export to Excel button
    document.getElementById('saveToExcelBtn').addEventListener('click', async function() {
        try {
            const response = await fetch('/main/api/yarn/export-excel', {
                method: 'GET',
                credentials: 'include'
            });

            if (!response.ok) {
                throw new Error(`HTTP error! Status: ${response.status}`);
            }

            const blob = await response.blob();
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.style.display = 'none';
            a.href = url;
            
            const contentDisposition = response.headers.get('content-disposition');
            let filename = 'yarn_receive_records.csv';
            if (contentDisposition) {
                const match = contentDisposition.match(/filename="(.+)"/);
                if (match) filename = match[1];
            }
            
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            window.URL.revokeObjectURL(url);
            document.body.removeChild(a);
            
            console.log('Export successful');

            const searchButtons = [
                { id: 'searchYarnDetailDropdown', text: '<i class="fas fa-search"></i> Search Yarn Detail' },
                { id: 'searchPostedLCDropdown', text: '<i class="fas fa-search"></i> Search Posted LC' },
                { id: 'searchYarnLotDropdown', text: '<i class="fas fa-search"></i> Search Yarn Lot' }
            ];
            
            searchButtons.forEach(btn => {
                const button = document.getElementById(btn.id);
                if (button) button.innerHTML = btn.text;
            });
            
            initializeFormFromTop();
        });
    }

    // Input event listeners for calculations
    document.addEventListener('input', function(e) {
        if (e.target.name === 'warp_required[]' || e.target.name === 'weft_required[]') {
            calculateRequirementsTotal();
        } else if (e.target.name === 'yarn_received_quantity[]') {
            calculateYarnReceivedTotal();
        }
    });

    const calculationInputs = ['receiptQtyKgs', 'piLcRate', 'dollarLcRate'];
    calculationInputs.forEach(inputId => {
        const input = document.getElementById(inputId);
        if (input) {
            input.addEventListener('input', calculateTotalTaka);
            input.addEventListener('change', calculateTotalTaka);
        }
    });

    // Initialize data fetching
    setTimeout(() => {
        fetchYarnDetails();
        fetchPostedLCs();
        fetchYarnLots();
        fetchDispoNumbers();
        fetchPONumbers();
        calculateRequirementsTotal();
        calculateYarnReceivedTotal();
        calculateTotalTaka();
        
        const dateFields = ['receivedStartDate', 'lastReceivedDate'];
        const currentDate = new Date().toISOString().split('T')[0];
        
        dateFields.forEach(fieldId => {
            const field = document.getElementById(fieldId);
            if (field && !field.value) {
                field.value = currentDate;
            }
        });
    }, 100);

    console.log('Yarn Received Form initialized successfully');
});
</script>
</body>
</html>
