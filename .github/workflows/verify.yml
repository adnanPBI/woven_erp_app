name: Verify source
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            sync/package-lock.json
      - run: npm ci --omit=dev
      - run: npm --prefix sync ci --omit=dev
      - run: npm run check
      - run: npm test
