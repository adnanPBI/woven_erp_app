<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dispo Wise Plan - Main Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-bg: linear-gradient(135deg, #121212 0%, #1e1e1e 100%);
            --container-bg: #252525;
            --text-color: #e0e0e0;
            --accent-color: #00c4ff;
            --card-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
            --btn-shadow: 0 5px 15px rgba(0, 0, 0, 0.4);
            --text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            --border-glow: rgba(0, 196, 255, 0.3);
        }
        
        .form-container .vertical-layout .column hr {
            border: 0;
            border-top: 1px solid #555;
            margin: 15px 0;
            width: 100%;
        }

        .form-container .vertical-layout {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 10px;
            align-items: start;
        }

        .vertical-layout .column {
            display: flex;
            flex-direction: column;
            gap: 0;
            min-height: 100%;
            min-width: 0;
        }

        body {
            background: var(--primary-bg);
            font-family: 'Poppins', sans-serif;
            color: var(--text-color);
            margin: 0;
            padding: 12px;
            box-sizing: border-box;
            height: 100vh;
            overflow: auto;
            background-attachment: fixed;
        }
        
        .section-header-height {
            min-height: 24px;
            line-height: 24px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
        }

        .main-container {
            background: var(--container-bg);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            padding: 15px;
            border: 2px solid #3a3a3a;
            height: auto;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 1;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(0, 196, 255, 0.03) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(0, 196, 255, 0.03) 0%, transparent 20%);
        }

        .main-container::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(45deg, transparent 49%, rgba(255, 255, 255, 0.03) 50%, transparent 51%);
            background-size: 10px 10px;
            pointer-events: none;
        }

        .header-controls {
            display: flex;
            flex-direction: column;
            gap: 24px;
            margin-bottom: 10px;
            flex-shrink: 0;
            background: rgba(0, 0, 0, 0.2);
            padding: 18px 15px;
            border-radius: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
            z-index: 1050;
            overflow: visible;
        }

        .header-title {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .header-buttons {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .button-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .header-controls::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 15%;
            width: 70%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-color), transparent);
        }

        .header-controls h1 {
            font-size: 1.9rem;
            font-weight: 700;
            color: var(--text-color);
            text-shadow: var(--text-shadow);
            margin: 0;
            background: linear-gradient(45deg, #FFA500, #FFD580);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
            white-space: nowrap;
        }

        .header-controls .btn, .header-controls .btn.dropdown-toggle {
            border-radius: 8px;
            transition: all 0.3s cubic-bezier(0.165, 0.84, 0.44, 1);
            border: none;
            color: #fff;
            box-shadow: var(--btn-shadow);
            font-size: 0.85rem;
            padding: 8px 16px;
            position: relative;
            overflow: hidden;
            z-index: 1;
            font-weight: 600;
            white-space: nowrap;
            min-width: 140px;
            text-align: center;
        }

        .btn-info { background: linear-gradient(135deg, #0d8991, #3bbcc4, #4fb4db) !important; }
        .btn-warning { background: linear-gradient(135deg, #ffc107, #fd7e14) !important; }
        .btn-primary { background: linear-gradient(135deg, #0a3a57, #0c8731, #09ad92) !important; }
        .btn-success { background: linear-gradient(135deg, #1e3954, #3b80db) !important; }
        .btn-danger { background: linear-gradient(135deg, #991509, #e83e8c) !important; }
        .btn-tertiary { background: linear-gradient(125deg, #090669, #394f99) !important; }
        .btn-secondary { background: linear-gradient(135deg, #6c757d, #495057) !important; }

        .header-controls .btn::before, .header-controls .btn.dropdown-toggle::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: all 0.5s ease;
            z-index: -1;
        }

        .header-controls .btn:hover, .header-controls .btn.dropdown-toggle:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.6);
        }

        .header-controls .btn:hover::before, .header-controls .btn.dropdown-toggle:hover::before {
            left: 100%;
        }

        .header-controls .btn i { margin-right: 6px; }
        
        .dropdown {
         position: relative;
          }

        .dropdown-menu {
            background: #303030;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4);
            z-index: 1051;
            max-height: 400px;
            overflow-y: auto;
        }

        .dropdown-item {
            color: var(--text-color);
            font-size: 0.8rem;
            padding: 10px 15px;
            transition: all 0.3s ease;
            white-space: nowrap; /* Prevent wrapping */
            overflow: hidden;
            text-overflow: ellipsis;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            
        }

        .dropdown-item:hover {
            background: #404040;
            color: #ffffff;
        }

        .dropdown-item:last-child {
            border-bottom: none;
        }

        /* Single-line dropdown item layout */
.dropdown-item-singleline {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.85rem;
    line-height: 1.4;
}

    

      .dropdown-item-field {
    display: inline-flex;
    align-items: center;
    gap: 4px;
}

.dropdown-item-field strong {
    color: var(--accent-color);
    font-weight: 600;
}

.dropdown-separator {
    color: var(--accent-color);
    font-weight: 700;
    margin: 0 4px;
}

/* Responsive dropdown for smaller screens */
@media (max-width: 768px) {
    .dropdown-menu {
        min-width: 100%;
        max-width: 95vw;
    }
    
    .dropdown-item {
        font-size: 0.75rem;
        padding: 6px 10px;
    }
}

        .form-container {
            background: #252525;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 15px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
            position: relative;
            z-index: 2;
        }

        .form-container:hover {
            background: #2D2D2D;
            box-shadow: inset 0 0 25px rgba(0, 0, 0, 0.3), 0 0 15px var(--border-glow);
            border-color: rgba(0, 196, 255, 0.2);
        }

        .form-label {
            color: var(--accent-color);
            font-weight: 600;
            margin-bottom: 0;
            font-size: 0.8rem;
            width: 40%;
            display: flex;
            align-items: center;
            flex-shrink: 0;
        }

        .form-control, .form-select {
            background-color: #404040;
            border: 1px solid #505050;
            color: var(--text-color);
            border-radius: 10px;
            padding: 6px 10px;
            height: 35px;
            font-size: 0.85rem;
            transition: all 0.3s ease;
            width: 60%;
        }

        .form-group i.fa-calendar-alt,
        .form-group i.fa-calendar-check {
            color: var(--accent-color) !important;
        }

        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        input[type="number"] { -moz-appearance: textfield; }

        .form-control:focus, .form-select:focus {
            background-color: #454545;
            color: var(--text-color);
            border-color: var(--accent-color);
            box-shadow: 0 0 0 0.25rem rgba(0, 196, 255, 0.25);
        }

        .form-control:hover, .form-select:hover { border-color: var(--accent-color); }

        .form-group {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            gap: 10px;
            position: relative;
        }

        .form-group i {
            position: absolute;
            right: 10px;
            color: var(--accent-color);
            font-size: 0.9rem;
            transition: all 0.3s ease;
            pointer-events: none;
            z-index: 10;
        }

        .form-group .form-control, .form-group .form-select { padding-right: 30px; }

        .form-group .form-control:focus ~ i,
        .form-group .form-select:focus ~ i {
            color: #ffffff;
            transform: scale(1.1);
        }
        
        html, body {
            scroll-behavior: auto !important;
            overflow-x: hidden;
        }

        html { scroll-padding-top: 0; }
        body { position: relative; }

        .result-field {
            background-color: #d68733 !important;
            border: none;
            color: #000 !important;
            font-weight: 600;
            padding: 6px 10px;
            border-radius: 10px;
            font-size: 0.95rem;
        }

        .form-group textarea.form-control {
            width: 60%;
            height: auto;
            min-height: 35px;
            resize: vertical;
        }

        @media (max-width: 1200px) {
            .button-row { justify-content: center; gap: 6px; }
            .header-controls .btn, .header-controls .btn.dropdown-toggle {
                font-size: 0.8rem;
                padding: 6px 12px;
                min-width: 120px;
            }
            .vertical-layout { grid-template-columns: 1fr 1fr; }
        }

        @media (max-width: 992px) {
            .button-row { flex-direction: column; align-items: stretch; gap: 8px; }
            .header-controls .btn, .header-controls .btn.dropdown-toggle {
                width: 100%;
                max-width: 200px;
                margin: 0 auto;
            }
            .vertical-layout { grid-template-columns: 1fr; }
            .form-group { flex-direction: column; align-items: stretch; gap: 5px; }
            .form-label { width: 100%; }
            .form-control, .form-select, .form-group textarea.form-control { width: 100%; }
            .form-group i {
                position: absolute;
                right: 10px;
                top: 50%;
                transform: translateY(-50%);
            }
        }

        @media (max-width: 768px) {
            .header-controls .btn, .header-controls .btn.dropdown-toggle {
                font-size: 0.75rem;
                padding: 6px 10px;
                min-width: 100px;
            }
            .form-label { font-size: 0.75rem; }
            .form-control, .form-select {
                font-size: 0.8rem;
                padding: 5px 8px;
                height: 32px;
            }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="header-controls">
            <div class="header-title">
                <h1>Dispo Wise Main Plan Entry Form</h1>
            </div>
            <div class="header-buttons">
                <div class="button-row">
                    <div class="dropdown">
                        <button class="btn btn-info dropdown-toggle" type="button" id="searchDispoNumberDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="fas fa-search"></i> Search Dispo Number
                        </button>
                        <ul class="dropdown-menu" aria-labelledby="searchDispoNumberDropdown" id="searchDispoNumberMenu">
                            <li><a class="dropdown-item disabled" href="#">No dispo numbers available</a></li>
                        </ul>
                    </div>
                    <div class="dropdown">
                        <button class="btn btn-tertiary dropdown-toggle" type="button" id="searchDispoPlanDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="fas fa-folder-open"></i> Search Dispo Plan
                        </button>
                        <ul class="dropdown-menu" aria-labelledby="searchDispoPlanDropdown" id="searchDispoPlanMenu">
                            <li><a class="dropdown-item disabled" href="#">No saved plans available</a></li>
                        </ul>
                    </div>
                    <button class="btn btn-warning" id="clearFormBtn"><i class="fas fa-eraser"></i> Clear Form</button>
                </div>
                
                <div class="button-row">
                    <button class="btn btn-primary" id="saveBtn"><i class="fas fa-save"></i> Save Record</button>
                    <button class="btn btn-primary" id="updateBtn"><i class="fas fa-refresh"></i> Update Record</button>
                    <button class="btn btn-success" id="exportBtn"><i class="fas fa-file-excel"></i> Export to Excel</button>
                    <button class="btn btn-danger" id="deleteBtn"><i class="fas fa-trash-alt"></i> Delete Record</button>
                    <a href="#" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Back</a>
                </div>
            </div>
        </div>

        <form id="dispoPlanForm">
            <div class="form-container">
                <div class="vertical-layout">
                    <!-- Column 1 -->
                    <div class="column">
                        <div class="form-group">
                            <label for="poIssueDate" class="form-label">PO Issue Date</label>
                            <input type="date" class="form-control" id="poIssueDate" name="po_issue_date">
                            <i class="fas fa-calendar-alt"></i>
                        </div>

                        <div class="form-group">
                            <label for="poReceivedDate" class="form-label">PO Received Date</label>
                            <input type="date" class="form-control" id="poReceivedDate" name="po_received_date">
                            <i class="fas fa-calendar-alt"></i>
                        </div>

                        <div class="form-group">
                            <label for="ppSampleDeliveryDate" class="form-label">PP Sample Delivery Date</label>
                            <input type="date" class="form-control" id="ppSampleDeliveryDate" name="pp_sample_delivery_date">
                            <i class="fas fa-calendar-alt"></i>
                        </div>

                        <div class="form-group">
                            <label for="bulkFabricDeliveryDate" class="form-label">Bulk Fabric Delivery Date</label>
                            <input type="date" class="form-control" id="bulkFabricDeliveryDate" name="bulk_fabric_delivery_date">
                            <i class="fas fa-calendar-alt"></i>
                        </div>

                        <div class="form-group">
                            <label for="poRevisedDate" class="form-label">PO Revised Date</label>
                            <input type="date" class="form-control" id="poRevisedDate" name="po_revised_date">
                            <i class="fas fa-calendar-alt"></i>
                        </div>

                        <div class="form-group">
                            <label for="bulkRevisedNo" class="form-label">Bulk Revised No.</label>
                            <input type="text" class="form-control" id="bulkRevisedNo" name="bulk_revised_no">
                            <i class="fas fa-hashtag"></i>
                        </div>

                        <div class="form-group">
                            <label for="bulkRevisedReason" class="form-label">Bulk Revised Reason</label>
                            <input type="text" class="form-control" id="bulkRevisedReason" name="bulk_revised_reason">
                            <i class="fas fa-comment"></i>
                        </div>

                        <div class="form-group">
                            <label for="reproductionRevisedNo" class="form-label">Reproduction Revised No.</label>
                            <input type="text" class="form-control" id="reproductionRevisedNo" name="reproduction_revised_no">
                            <i class="fas fa-hashtag"></i>
                        </div>

                        <div class="form-group">
                            <label for="reproductionRevisedReason" class="form-label">Reproduction Revised Reason</label>
                            <input type="text" class="form-control" id="reproductionRevisedReason" name="reproduction_revised_reason">
                            <i class="fas fa-comment"></i>
                        </div>

                        <div class="form-group">
                            <label for="poNo" class="form-label">PO No.</label>
                            <input type="text" class="form-control" id="poNo" name="po_no">
                            <i class="fas fa-file-invoice"></i>
                        </div>

                        <div class="form-group">
                            <label for="piUnitLcUnit" class="form-label">PI Unit/LC Unit</label>
                            <input type="text" class="form-control" id="piUnitLcUnit" name="pi_unit_lc_unit">
                            <i class="fas fa-building"></i>
                        </div>

                        <div class="form-group">
                            <label for="orderNo" class="form-label">Order No</label>
                            <input type="text" class="form-control" id="orderNo" name="order_no">
                            <i class="fas fa-receipt"></i>
                        </div>

                        <div class="form-group">
                            <label for="accountHolder" class="form-label">Account Holder</label>
                            <input type="text" class="form-control" id="accountHolder" name="account_holder">
                            <i class="fas fa-user-circle"></i>
                        </div>

                        <div class="form-group">
                            <label for="buyer" class="form-label">Buyer</label>
                            <input type="text" class="form-control" id="buyer" name="buyer">
                            <i class="fas fa-user-tie"></i>
                        </div>

                        <div class="form-group">
                            <label for="garmentsName" class="form-label">Garments Name</label>
                            <input type="text" class="form-control" id="garmentsName" name="garments_name">
                            <i class="fas fa-tshirt"></i>
                        </div>

                        <div class="form-group">
                            <label for="customerRefStl" class="form-label">Customer Ref/Stl</label>
                            <input type="text" class="form-control" id="customerRefStl" name="customer_ref_stl">
                            <i class="fas fa-tag"></i>
                        </div>

                        <div class="form-group">
                            <label for="buyerColorReference" class="form-label">Buyer Color Reference</label>
                            <input type="text" class="form-control" id="buyerColorReference" name="buyer_color_reference">
                            <i class="fas fa-palette"></i>
                        </div>

                        <div class="form-group">
                            <label for="weave" class="form-label">Weave</label>
                            <input type="text" class="form-control" id="weave" name="weave">
                            <i class="fas fa-project-diagram"></i>
                        </div>

                        <div class="form-group">
                            <label for="finishType" class="form-label">Finish Type</label>
                            <input type="text" class="form-control" id="finishType" name="finish_type">
                            <i class="fas fa-check-circle"></i>
                        </div>

                        <div class="form-group">
                            <label for="marketingReffTrackingNo" class="form-label">Marketing Reff/Tracking No</label>
                            <input type="text" class="form-control" id="marketingReffTrackingNo" name="marketing_reff_tracking_no">
                            <i class="fas fa-bullhorn"></i>
                        </div>

                        <div class="form-group">
                            <label for="deskLoomStrikeOffNo" class="form-label">Desk Loom/Strike Off No</label>
                            <input type="text" class="form-control" id="deskLoomStrikeOffNo" name="desk_loom_strike_off_no">
                            <i class="fas fa-desktop"></i>
                        </div>

                        <div class="form-group">
                            <label for="endUse" class="form-label">End Use</label>
                            <input type="text" class="form-control" id="endUse" name="end_use">
                            <i class="fas fa-flag"></i>
                        </div>

                        <div class="form-group">
                            <label for="orderType" class="form-label">Order Type</label>
                            <select class="form-select" id="orderType" name="order_type">
                                <option value="">Select Type</option>
                                <option value="Bulk">Bulk</option>
                                <option value="Sample">Sample</option>
                                <option value="Re-order">Re-order</option>
                            </select>
                            <i class="fas fa-list"></i>
                        </div>

                        <div class="form-group">
                            <label for="yarnType" class="form-label">Yarn Type</label>
                            <input type="text" class="form-control" id="yarnType" name="yarn_type">
                            <i class="fas fa-wool-ball"></i>
                        </div>

                        <div class="form-group">
                            <label for="fabricType" class="form-label">Fabric Type</label>
                            <input type="text" class="form-control" id="fabricType" name="fabric_type">
                            <i class="fas fa-tshirt"></i>
                        </div>

                        <div class="form-group">
                            <label for="processType" class="form-label">Process Type</label>
                            <input type="text" class="form-control" id="processType" name="process_type">
                            <i class="fas fa-cogs"></i>
                        </div>

                        <div class="form-group">
                            <label for="printMethod" class="form-label">Print Method</label>
                            <input type="text" class="form-control" id="printMethod" name="print_method">
                            <i class="fas fa-print"></i>
                        </div>

                        
                    </div>

                    <!-- Column 2 -->
                    <div class="column">
                        <div class="form-group">
                            <label for="dispoNo" class="form-label">Dispo No.</label>
                            <input type="text" class="form-control result-field" id="dispoNo" name="dispo_no">
                            <i class="fas fa-receipt"></i>
                        </div>

                        <div class="form-group">
                            <label for="stickerConstruction" class="form-label">Sticker Construction</label>
                            <input type="text" class="form-control" id="stickerConstruction" name="sticker_construction">
                            <i class="fas fa-sticky-note"></i>
                        </div>

                        <div class="form-group">
                            <label for="productionConstruction" class="form-label">Production Construction</label>
                            <input type="text" class="form-control" id="productionConstruction" name="production_construction">
                            <i class="fas fa-industry"></i>
                        </div>
                        <div class="form-group">
                            <label for="stickerComposition" class="form-label">Sticker Composition</label>
                            <input type="text" class="form-control" id="stickerComposition" name="sticker_composition">
                            <i class="fas fa-layer-group"></i>
                        </div>

                        <div class="form-group">
                            <label for="fabricComposition" class="form-label">Fabric Composition</label>
                            <textarea class="form-control" id="fabricComposition" name="fabric_composition" rows="1"></textarea>
                            <i class="fas fa-layer-group"></i>
                        </div>

                        <div class="form-group">
                            <label for="finishEPI" class="form-label">Finish EPI</label>
                            <input type="number" step="0.01" class="form-control" id="finishEPI" name="finish_epi">
                            <i class="fas fa-grip-lines-vertical"></i>
                        </div>

                        <div class="form-group">
                            <label for="finishPPI" class="form-label">Finish PPI</label>
                            <input type="number" step="0.01" class="form-control" id="finishPPI" name="finish_ppi">
                            <i class="fas fa-grip-lines"></i>

async function fetchDispoPlanRecords() {
    try {
        const response = await fetch('/main/api/dispo-plan/dispo-numbers', {
            method: 'GET',
            credentials: 'include'
        });

        if (!response.ok) throw new Error(`HTTP error! Status: ${response.status}`);

        const records = await response.json();
        const planMenu = document.getElementById('searchDispoPlanMenu');

        if (!planMenu) return;

        if (records.length === 0) {
            planMenu.innerHTML = '<li><a class="dropdown-item disabled" href="#">No saved plans available</a></li>';
        } else {
            planMenu.innerHTML = records.map(record => {
                const displayHTML = `
                    <div class="dropdown-item-singleline">
                        <span class="dropdown-item-field"><strong>Dispo:</strong> ${record.dispo_no || 'N/A'}</span>
                        <span class="dropdown-separator">|</span>
                        <span class="dropdown-item-field"><strong>PO:</strong> ${record.po_no || 'N/A'}</span>
                        <span class="dropdown-separator">|</span>
                        <span class="dropdown-item-field"><strong>Construction:</strong> ${record.production_construction || 'N/A'}</span>
                        <span class="dropdown-separator">|</span>
                        <span class="dropdown-item-field"><strong>Buyer:</strong> ${record.buyer || 'N/A'}</span>
                    </div>
                `;
                return `<li><a class="dropdown-item" href="#" data-plan-id="${record.id}">${displayHTML}</a></li>`;
            }).join('');
        }

        attachDispoPlanListeners();

    } catch (error) {
        console.error('Failed to load saved dispo plans:', error);
    }
}

        // ========== FETCH AND POPULATE COMPLETE DISPO DATA FROM DISPO SYSTEM ==========
        async function fetchAndPopulateDispoData(dispoNumber) {
            try {
                const response = await fetch(`/main/api/dispo/fetch/${encodeURIComponent(dispoNumber)}`, {
                    credentials: 'include'
                });

                if (!response.ok) {
                    console.warn('Dispo data not found in dispo system');
                    document.getElementById('dispoNo').value = dispoNumber;
                    return;
                }

                const responseData = await response.json();
                const dispoData = responseData.dispoData;

                if (!dispoData) {
                    console.warn('No dispoData in response');
                    document.getElementById('dispoNo').value = dispoNumber;
                    return;

                // Always set dispo_no field
                document.getElementById('dispoNo').value = dispoNumber;

                // Populate fields - only fill if empty to preserve existing data

                    if (!dateString) return '';
                    try {

                    } catch (e) {
                        return '';
                    }
                };

                if (dispoData.po_issue_date && !document.getElementById('poIssueDate').value) {

        // ========== FIXED: Load Record By Dispo Number (ONLY loads dispo data, never plan data) ==========
async function loadRecordByDispoNumber(dispoNumber) {
    try {
        // IMPORTANT: Always load ONLY dispo data, never check for existing plan
        // This ensures "Search Dispo Number" only populates dispo fields
        console.log('Loading dispo data (not plan) from dispo_form_data:', dispoNumber);
        
        // Clear the form first to remove any previous plan data
        const form = document.getElementById('dispoPlanForm');
        if (form) form.reset();
        
        // Reset calculated fields
        calculateTotalConsumption();
        calculateTotalCoverFactor();
        
        // Fetch and populate ONLY dispo data from dispo_form_data table
        await fetchAndPopulateDispoData(dispoNumber);

        // Update the button text
        const searchButton = document.getElementById('searchDispoNumberDropdown');
        if (searchButton) {
            searchButton.innerHTML = `<i class="fas fa-search"></i> Dispo: ${dispoNumber}`;
        }

        // Clear the current record ID since we're not loading a saved plan
        currentRecordId = null;

        window.scrollTo({ top: 0, behavior: 'smooth' });

    } catch (error) {
        console.error('Error loading dispo:', error);
        alert('Failed to load dispo: ' + error.message);
    }
}

        // ========== LOAD RECORD BY ID ==========
        async function loadRecord(recordId) {
            try {
                const response = await fetch(`/main/api/dispo-plan/fetch-by-id/${recordId}`, {
                    method: 'GET',
                    credentials: 'include'
                });

                if (!response.ok) throw new Error(`HTTP error! Status: ${response.status}`);

                const data = await response.json();

                currentRecordId = data.id;

                const form = document.getElementById('dispoPlanForm');
                if (form) {
                    for (const [key, value] of Object.entries(data)) {
                        const input = form.querySelector(`[name="${key}"]`);
                        if (input) {
                            if (input.type === 'date' && value) {
                                try {
                                    input.value = new Date(value).toISOString().split('T')[0];
                                } catch (e) {
                                    input.value = '';
                                }
                            } else {
                                input.value = value || '';
                            }
                        }
                    }
                }

                if (data.dispo_no) {
                    await fetchAndPopulateDispoData(data.dispo_no);
                }

                calculateTotalConsumption();
                calculateTotalCoverFactor();

                const searchButton = document.getElementById('searchDispoNumberDropdown');
                if (searchButton && data.dispo_no) {
                    searchButton.innerHTML = `<i class="fas fa-search"></i> Dispo: ${data.dispo_no}`;
                }

                window.scrollTo({ top: 0, behavior: 'smooth' });

            } catch (error) {
                console.error('Error loading record:', error);
                alert('Failed to load record: ' + error.message);
            }
        }

        // ========== DOM CONTENT LOADED ==========
        document.addEventListener('DOMContentLoaded', function() {
            ['warpConsumption', 'weftConsumption'].forEach(id => {
                const field = document.getElementById(id);
                if (field) {
                    field.addEventListener('input', calculateTotalConsumption);
                    field.addEventListener('change', calculateTotalConsumption);
                }
            });

            ['warpCoverFactor', 'weftCoverFactor'].forEach(id => {
                const field = document.getElementById(id);
                if (field) {
                    field.addEventListener('input', calculateTotalCoverFactor);
                    field.addEventListener('change', calculateTotalCoverFactor);
                }
            });

            document.getElementById('clearFormBtn')?.addEventListener('click', function() {
                const form = document.getElementById('dispoPlanForm');
                if (form) form.reset();
                
                currentRecordId = null;
                
                const searchButton = document.getElementById('searchDispoNumberDropdown');
                if (searchButton) {
                    searchButton.innerHTML = '<i class="fas fa-search"></i> Search Dispo Number';
                }
                
                calculateTotalConsumption();
                calculateTotalCoverFactor();
                
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });

            document.getElementById('saveBtn')?.addEventListener('click', async function() {
                try {
                    const form = document.getElementById('dispoPlanForm');
                    const formData = new FormData(form);
                    const data = {};
                    
                    for (let [key, value] of formData.entries()) {
                        data[key] = value;
                    }
                    
                    console.log('Saving payload:', data);
                    
                    const response = await fetch('/main/api/dispo-plan/save', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        credentials: 'include',
                        body: JSON.stringify(data)
                    });
                    
                    const result = await response.json();
                    
                    if (!response.ok) {
                        console.error('Server error details:', result);
                        throw new Error(result.message || result.error || `HTTP error! Status: ${response.status}`);
                    }
                    
                    currentRecordId = result.id;
                    alert('Data saved successfully!');
                    console.log('Save successful:', result);
                    
                    fetchDispoNumbers();
                    fetchDispoPlanRecords();
                    
                } catch (error) {
                    console.error('Error saving data:', error);
                    alert('Failed to save data: ' + error.message);
                }
            });

            document.getElementById('updateBtn')?.addEventListener('click', async function() {
                if (!currentRecordId) {
                    alert('No record selected for update. Please search and load a record first.');
                    return;
                }
                
                try {
                    const form = document.getElementById('dispoPlanForm');
                    const formData = new FormData(form);
                    const data = {};
                    
                    for (let [key, value] of formData.entries()) {
                        data[key] = value;
                    }
                    
                    console.log('Updating payload:', data);
                    
                    const response = await fetch(`/main/api/dispo-plan/update/${currentRecordId}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        credentials: 'include',
                        body: JSON.stringify(data)
                    });
                    
                    if (!response.ok) throw new Error(`HTTP error! Status: ${response.status}`);
                    
                    const result = await response.json();
                    alert('Data updated successfully!');
                    console.log('Update successful:', result);
                    
                    fetchDispoNumbers();
                    fetchDispoPlanRecords();
                    
                } catch (error) {
                    console.error('Error updating data:', error);
                    alert('Failed to update data: ' + error.message);
                }
            });

            document.getElementById('exportBtn')?.addEventListener('click', async function() {
                try {
                    const response = await fetch('/main/api/dispo-plan/export-excel', {
                        method: 'GET',
                        credentials: 'include'
                    });

                    if (!response.ok) throw new Error(`HTTP error! Status: ${response.status}`);

                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.style.display = 'none';
                    a.href = url;
                    a.download = 'dispo_plan_records.csv';
                    document.body.appendChild(a);
                    a.click();
                    window.URL.revokeObjectURL(url);
                    document.body.removeChild(a);
                    
                    console.log('Export successful');
                } catch (error) {
                    console.error('Error exporting data:', error);
                    alert('Failed to export data: ' + error.message);
                }
            });

            document.getElementById('deleteBtn')?.addEventListener('click', async function() {
                if (!currentRecordId) {
                    alert('No record selected for deletion. Please search and load a record first.');
                    return;
                }

                if (!confirm(`Are you sure you want to delete this record? This action cannot be undone.`)) {
                    return;
                }

                try {
                    const response = await fetch(`/main/api/dispo-plan/delete/${currentRecordId}`, {
                        method: 'DELETE',
                        credentials: 'include'
                    });

                    if (!response.ok) throw new Error(`HTTP error! Status: ${response.status}`);

                    const result = await response.json();
                    alert('Record deleted successfully!');
                    console.log('Delete successful:', result);
                    
                    document.getElementById('clearFormBtn').click();
                    fetchDispoNumbers();
                    fetchDispoPlanRecords();
                    
                } catch (error) {
                    console.error('Error deleting record:', error);
                    alert('Failed to delete record: ' + error.message);
                }
            });

            setTimeout(() => {
                fetchDispoNumbers();
                fetchDispoPlanRecords();
            }, 100);

            calculateTotalConsumption();
            calculateTotalCoverFactor();

            console.log('Dispo Wise Plan Form initialized successfully');
        });
    </script>
